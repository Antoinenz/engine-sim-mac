name: Build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    name: macOS (Apple Silicon)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: brew install ninja sdl2 sdl2_image boost bison dylibbundler

      - name: Configure
        run: |
          export PATH="$(brew --prefix bison)/bin:$PATH"
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --target engine-sim-app

      - name: Package
        run: |
          scripts/package-macos.sh build "dist/Engine Sim"
          cd dist && ditto -c -k --keepParent "Engine Sim" ../engine-sim-macos-arm64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: engine-sim-macos-arm64
          path: engine-sim-macos-arm64.zip

  windows:
    name: Windows (x64)
    runs-on: windows-2022
    env:
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}\vcpkg-cache,readwrite
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/cache@v4
        with:
          path: vcpkg-cache
          key: vcpkg-windows-sdl2-boost-v1

      - name: Install dependencies
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force vcpkg-cache | Out-Null
          # SDL as DLLs (shipped next to the exe), Boost static to match
          # Boost_USE_STATIC_LIBS in the CMake files
          vcpkg install sdl2:x64-windows sdl2-image:x64-windows boost-filesystem:x64-windows-static-md
          choco install winflexbison3 -y --no-progress

      - name: Configure
        shell: pwsh
        run: |
          $vcpkg = "$env:VCPKG_INSTALLATION_ROOT/installed"
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 `
            "-DCMAKE_PREFIX_PATH=$vcpkg/x64-windows;$vcpkg/x64-windows-static-md" `
            -DCMAKE_POLICY_DEFAULT_CMP0167=NEW `
            -DDISCORD_ENABLED=OFF

      - name: Build
        run: cmake --build build --config Release --target engine-sim-app

      - name: Package
        shell: pwsh
        run: |
          scripts/package-windows.ps1 `
            -Exe build/Release/engine-sim-app.exe `
            -SdlBinDir "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/bin" `
            -OutDir "dist/Engine Sim"
          Compress-Archive -Path "dist/Engine Sim" -DestinationPath engine-sim-windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: engine-sim-windows-x64
          path: engine-sim-windows-x64.zip

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: '*.zip'
